# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect this repo, set DATABASE_URL to a Neon or Render Postgres URL,
# and set CORS_ORIGINS to your Cloudflare Pages origin.
services:
  - type: web
    name: srz-admin-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: HOST
        value: 0.0.0.0
