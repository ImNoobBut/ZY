# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect this repo, set DATABASE_URL to a Neon or Render Postgres URL,
# and set CORS_ORIGINS to your Cloudflare Pages origin.
services:
  - type: web
    name: srz-admin-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: HOST
        value: 0.0.0.0
      # Password-reset mail (set values in Render dashboard — do not commit secrets)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: APP_DISPLAY_NAME
        value: Zy Sleep
