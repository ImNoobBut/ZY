name: SleepingRoutineForZy
options:
  bundleIdPrefix: com.zy
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_CFBundleDisplayName: Sleeping Routine for Zy
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
configs:
  Debug: debug
  Release: release
targets:
  SleepingRoutineForZy:
    type: application
    platform: iOS
    sources:
      - path: SleepingRoutineForZy
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zy.sleepingroutine
        INFOPLIST_FILE: SleepingRoutineForZy/Resources/Info.plist
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    scheme:
      testTargets:
        - SleepingRoutineForZyTests
        - SleepingRoutineForZyUITests
  SleepingRoutineForZyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SleepingRoutineForZyTests
    dependencies:
      - target: SleepingRoutineForZy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zy.sleepingroutine.tests
        GENERATE_INFOPLIST_FILE: YES
  SleepingRoutineForZyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SleepingRoutineForZyUITests
    dependencies:
      - target: SleepingRoutineForZy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zy.sleepingroutine.uitests
        GENERATE_INFOPLIST_FILE: YES
