name: Deploy Flutter web (Cloudflare Pages)

on:
  push:
    branches: [main, master]
    paths:
      - "flutter_app/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web (PWA offline-first)
        working-directory: flutter_app
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          flutter pub get
          flutter build web --release --pwa-strategy=offline-first \
            --dart-define=BACKEND_BASE_URL=${BACKEND_BASE_URL:-https://YOUR-RENDER-URL.onrender.com} \
            --dart-define=SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: sleeping-routine-for-zy
          directory: flutter_app/build/web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
