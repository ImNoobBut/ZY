name: Deploy Flutter web (Cloudflare Pages)

on:
  push:
    branches: [main, master]
    paths:
      - "flutter_app/**"
      - "scripts/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Also build Android APK and publish under /downloads/"
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_apk }}
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_apk }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Android APK (optional publish)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_apk }}
        working-directory: flutter_app
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          set -euo pipefail
          flutter pub get
          DEFINES=()
          if [ -n "${BACKEND_BASE_URL:-}" ]; then
            DEFINES+=("--dart-define=BACKEND_BASE_URL=${BACKEND_BASE_URL}")
          fi
          if [ -n "${SPOTIFY_CLIENT_ID:-}" ]; then
            DEFINES+=("--dart-define=SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}")
          fi
          flutter build apk --release --split-per-abi "${DEFINES[@]}"
          mkdir -p web/downloads
          # Prefer arm64 phones; Cloudflare Pages max file size is 25 MiB.
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk web/downloads/zy-sleep.apk
          else
            cp -f build/app/outputs/flutter-apk/app-release.apk web/downloads/zy-sleep.apk
          fi

      - name: Build web
        working-directory: flutter_app
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REDIRECT_URI: ${{ vars.SPOTIFY_REDIRECT_URI }}
          ANDROID_APK_URL: ${{ vars.ANDROID_APK_URL }}
          IOS_INSTALL_URL: ${{ vars.IOS_INSTALL_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_BASE_URL:-}" ]; then
            echo "Set repository variable BACKEND_BASE_URL" >&2
            exit 1
          fi
          flutter pub get
          DEFINES=(
            "--dart-define=BACKEND_BASE_URL=${BACKEND_BASE_URL}"
          )
          if [ -n "${SPOTIFY_CLIENT_ID:-}" ]; then
            DEFINES+=("--dart-define=SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}")
          fi
          # Optional: local/override only; hosted Pages uses {origin}/callback at runtime.
          if [ -n "${SPOTIFY_REDIRECT_URI:-}" ]; then
            DEFINES+=("--dart-define=SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}")
          fi
          if [ -n "${ANDROID_APK_URL:-}" ]; then
            DEFINES+=("--dart-define=ANDROID_APK_URL=${ANDROID_APK_URL}")
          fi
          if [ -n "${IOS_INSTALL_URL:-}" ]; then
            DEFINES+=("--dart-define=IOS_INSTALL_URL=${IOS_INSTALL_URL}")
          fi
          # Prefer classic JS build; --pwa-strategy is deprecated on newer Flutter.
          flutter build web --release --no-wasm-dry-run "${DEFINES[@]}"
          mkdir -p build/web/downloads
          if [ -f web/downloads/zy-sleep.apk ]; then
            cp -f web/downloads/zy-sleep.apk build/web/downloads/zy-sleep.apk
          fi
          if [ -f web/downloads/zy-sleep.ipa ]; then
            cp -f web/downloads/zy-sleep.ipa build/web/downloads/zy-sleep.ipa
          fi

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          directory: flutter_app/build/web
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
