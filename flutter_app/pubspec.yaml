name: sleeping_routine_for_zy
description: Spotify sleep timer for Zy — Flutter (Android + Web). Lite build - timer pauses Spotify when time is up.
publish_to: "none"
version: 0.10.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  crypto: ^3.0.6
  uuid: ^4.5.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  app_links: ^6.3.3
  web: ^1.1.1
  connectivity_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
