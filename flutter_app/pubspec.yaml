name: sleeping_routine_for_zy
description: Sleeping Routine for Zy — Flutter port (Android + Web). Swift iOS app remains the native source of truth.
publish_to: "none"
version: 0.9.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  http: ^1.2.2
  crypto: ^3.0.6
  uuid: ^4.5.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  audioplayers: ^6.1.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.0.0
  permission_handler: ^11.3.1
  app_links: ^6.3.3
  web: ^1.1.1
  connectivity_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
